[package]
name = "spatren-desktop"
version = "1.0.0"
description = "SPATREN Desktop: import field recordings, transcribe Sinhala locally, review and export"
authors = ["Anusara14"]
edition = "2021"

[lib]
name = "spatren_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
